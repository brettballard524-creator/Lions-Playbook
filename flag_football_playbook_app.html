  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b1320;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .font-montserrat { font-family: 'Montserrat', sans-serif; }
    
    /* Custom Chalkboard Texture */
    .chalkboard {
      background: #142232;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.4) 100%),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.01) 0px, rgba(255, 255, 255, 0.01) 2px, transparent 2px, transparent 4px);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8), 0 10px 30px rgba(0,0,0,0.5);
      border: 8px solid #233448;
    }

    /* Lions Accents */
    .border-honolulu { border-color: #0076B6; }
    .bg-honolulu { background-color: #0076B6; }
    .text-honolulu { color: #0076B6; }
    .bg-silver { background-color: #B0B7BC; }
    .text-silver { color: #B0B7BC; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b1320; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #0076B6; }

    /* Responsive canvas wrapper */
    .canvas-container {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 42%; /* 1000x420 aspect ratio */
    }
    .canvas-container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 8px;
    }

    .active-nav-item {
      background-color: #0076B6 !important;
      color: #ffffff !important;
      border-left: 4px solid #B0B7BC;
    }
  </style>
</head>

    /* ==========================================================================
       2. STATE & GLOBALS
       ========================================================================== */
    let currentSlideIdx = 0;
    let isPlaying = false;
    let animProgress = 0; // 0.0 to 1.0
    let lastTime = 0;
    let animFrameId = null;
    let animSpeed = 1.0;
    let showTrails = true;

    // DOM Elements
    const slideNav = document.getElementById('slideNav');
    const staticSlideView = document.getElementById('staticSlideView');
    const playSlideView = document.getElementById('playSlideView');
    const slideTitle = document.getElementById('slideTitle');
    const slideCategory = document.getElementById('slideCategory');
    const slideMeta = document.getElementById('slideMeta');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playerCardStrip = document.getElementById('playerCardStrip');
    const coachingText = document.getElementById('coachingText');
    const coachingTag = document.getElementById('coachingTag');
    const canvas = document.getElementById('playboardCanvas');
    const ctx = canvas.getContext('2d');

    // Controls
    const playAnimBtn = document.getElementById('playAnimBtn');
    const pauseAnimBtn = document.getElementById('pauseAnimBtn');
    const resetAnimBtn = document.getElementById('resetAnimBtn');
    const speedSelect = document.getElementById('speedSelect');
    const trailToggle = document.getElementById('trailToggle');

    /* ==========================================================================
       3. NAVIGATION & RENDERING LOGIC
       ========================================================================== */
    function initApp() {
      renderNav();
      loadSlide(0);

      // Event Listeners
      prevBtn.addEventListener('click', () => loadSlide(currentSlideIdx - 1));
      nextBtn.addEventListener('click', () => loadSlide(currentSlideIdx + 1));
      
      playAnimBtn.addEventListener('click', startAnimation);
      pauseAnimBtn.addEventListener('click', pauseAnimation);
      resetAnimBtn.addEventListener('click', resetAnimation);

      speedSelect.addEventListener('change', (e) => animSpeed = parseFloat(e.target.value));
      trailToggle.addEventListener('change', (e) => {
        showTrails = e.target.checked;
        drawPlayboard();
      });

      document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);

      // Keyboard arrow shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ') {
          if (currentSlideIdx < PLAYBOOK_DATA.length - 1) loadSlide(currentSlideIdx + 1);
        } else if (e.key === 'ArrowLeft') {
          if (currentSlideIdx > 0) loadSlide(currentSlideIdx - 1);
        }
      });
    }

    function renderNav() {
      slideNav.innerHTML = '';
      PLAYBOOK_DATA.forEach((slide, idx) => {
        const btn = document.createElement('button');
        btn.className = `w-full text-left px-3.5 py-2.5 rounded-lg text-xs md:text-sm font-semibold transition flex items-center justify-between hover:bg-slate-800 text-slate-300`;
        btn.onclick = () => loadSlide(idx);
        
        btn.innerHTML = `
          <div class="flex items-center gap-2.5 truncate">
            <span class="w-5 h-5 rounded-full ${slide.type === 'play' ? 'bg-honolulu/20 text-sky-400' : 'bg-slate-800 text-slate-400'} text-[10px] flex items-center justify-center font-mono font-bold">${idx + 1}</span>
            <span class="truncate">${slide.title}</span>
          </div>
          <span class="text-[10px] font-mono opacity-60 ml-2">${slide.code}</span>
        `;
        slideNav.appendChild(btn);
      });
    }

    function loadSlide(idx) {
      if (idx < 0 || idx >= PLAYBOOK_DATA.length) return;
      currentSlideIdx = idx;
      pauseAnimation();
      animProgress = 0;

      // Update Nav Buttons
      Array.from(slideNav.children).forEach((child, i) => {
        if (i === idx) child.classList.add('active-nav-item');
        else child.classList.remove('active-nav-item');
      });

      const slide = PLAYBOOK_DATA[idx];
      slideCategory.innerText = slide.category;
      slideMeta.innerText = `SLIDE ${String(idx + 1).padStart(2, '0')}`;
      slideTitle.innerText = slide.title;

      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === PLAYBOOK_DATA.length - 1;

      if (slide.type === 'play') {
        staticSlideView.classList.add('hidden');
        playSlideView.classList.remove('hidden');
        renderPlayerCards(slide);
        coachingText.innerHTML = slide.coachingCue;
        coachingTag.innerText = slide.coachingTag;
        drawPlayboard();
      } else {
        playSlideView.classList.add('hidden');
        staticSlideView.classList.remove('hidden');
        renderStaticSlide(slide);
      }
    }

    function renderStaticSlide(slide) {
      if (slide.id === 'slide-1') {
        staticSlideView.innerHTML = `
          <div class="p-8 md:p-14 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl flex flex-col justify-center max-w-4xl mx-auto w-full">
            <span class="text-honolulu font-montserrat font-bold text-lg md:text-2xl tracking-wider uppercase mb-2">5th/6th Grade Lions</span>
            <h1 class="font-montserrat font-black text-4xl md:text-6xl text-white tracking-tight leading-none mb-6">
              FLAG FOOTBALL<br/><span class="text-silver">PLAYBOOK</span>
            </h1>
            <p class="text-slate-300 text-base md:text-xl leading-relaxed max-w-2xl mb-8">
              Interactive tactical chalkboard with animated routes, pre-snap jet motion, real-time timing reads, and full coaching breakdowns.
            </p>
            <div class="flex items-center gap-4">
              <button onclick="loadSlide(1)" class="px-6 py-3 bg-honolulu hover:bg-sky-600 text-white font-montserrat font-bold text-base rounded-xl transition shadow-lg flex items-center gap-3">
                Begin Playbook <i class="fa-solid fa-arrow-right"></i>
              </button>
            </div>
          </div>
        `;
      } else if (slide.id === 'slide-2') {
        staticSlideView.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 max-w-5xl mx-auto w-full shadow-2xl flex flex-col gap-6">
            <div class="border-b border-slate-800 pb-4 flex justify-between items-center">
              <div>
                <p class="text-xs font-bold text-honolulu uppercase tracking-wider">TEAM CULTURE & IDENTITY</p>
                <h2 class="font-montserrat font-extrabold text-2xl md:text-3xl text-white">THE LIONS WAY</h2>
              </div>
              <div class="w-10 h-10 rounded-lg bg-honolulu/20 border border-honolulu flex items-center justify-center text-sky-400 font-bold">L</div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
              <div class="bg-slate-950 border-l-4 border-honolulu p-4 rounded-xl flex flex-col gap-2">
                <span class="font-montserrat font-black text-3xl text-honolulu">L</span>
                <h3 class="font-montserrat font-bold text-sm text-white">LEADERSHIP</h3>
                <p class="text-xs text-slate-300 leading-relaxed">Lead by example on and off the field.</p>
              </div>

              <div class="bg-slate-950 border-l-4 border-silver p-4 rounded-xl flex flex-col gap-2">
                <span class="font-montserrat font-black text-3xl text-silver">I</span>
                <h3 class="font-montserrat font-bold text-sm text-white">INTENSITY</h3>
                <p class="text-xs text-slate-300 leading-relaxed">Bring energy and maximum effort each play.</p>
              </div>

              <div class="bg-slate-950 border-l-4 border-honolulu p-4 rounded-xl flex flex-col gap-2">
                <span class="font-montserrat font-black text-3xl text-honolulu">O</span>
                <h3 class="font-montserrat font-bold text-sm text-white">ONE TEAM</h3>
                <p class="text-xs text-slate-300 leading-relaxed">Play for each other; everyone has a role.</p>
              </div>

              <div class="bg-slate-950 border-l-4 border-silver p-4 rounded-xl flex flex-col gap-2">
                <span class="font-montserrat font-black text-3xl text-silver">N</span>
                <h3 class="font-montserrat font-bold text-sm text-white">NEXT PLAY</h3>
                <p class="text-xs text-slate-300 leading-relaxed">Good or bad, quickly move on to the next snap.</p>
              </div>

              <div class="bg-slate-950 border-l-4 border-honolulu p-4 rounded-xl flex flex-col gap-2">
                <span class="font-montserrat font-black text-3xl text-honolulu">S</span>
                <h3 class="font-montserrat font-bold text-sm text-white">SPORTSMANSHIP</h3>
                <p class="text-xs text-slate-300 leading-relaxed">Compete hard and do it the right way.</p>
              </div>
            </div>

            <div class="bg-blue-950/40 border border-blue-800/40 p-4 rounded-xl text-xs md:text-sm text-slate-300 flex items-center justify-between">
              <span><b>Standard of Excellence:</b> Execute your job, lift up your teammates, and leave it all on the field.</span>

    }

    function renderPlayerCards(slide) {
      playerCardStrip.innerHTML = '';
      slide.players.forEach(p => {
        const card = document.createElement('div');
        card.className = "bg-slate-900/90 border-l-4 p-2.5 rounded-lg shadow border border-slate-800/80 flex flex-col justify-between";
        card.style.borderLeftColor = p.color;
        card.innerHTML = `
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full inline-block" style="background:${p.color}"></span>
            <p class="text-xs font-bold truncate text-slate-300">${p.title}</p>
          </div>
          <p class="text-xs md:text-sm font-semibold text-white mt-1 truncate">${p.note}</p>
        `;
        playerCardStrip.appendChild(card);
      });
    }

    /* ==========================================================================
       4. ANIMATION & CANVAS CHALKBOARD DRAWING
       ========================================================================== */
    function drawPlayboard() {
      const slide = PLAYBOOK_DATA[currentSlideIdx];
      if (!slide || slide.type !== 'play') return;

      // Clear & Draw Field Backdrop Lines
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Yard lines (Dashed Chalk Lines)
      ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);

      // 5-Yard Lines
      [70, 170, 270].forEach(y => {
        ctx.beginPath();
        ctx.moveTo(30, y);
        ctx.lineTo(970, y);
        ctx.stroke();
      });

      // Line of Scrimmage (LOS)
      ctx.strokeStyle = "#fbbf24";
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 6]);
      ctx.beginPath();
      ctx.moveTo(30, 270);
      ctx.lineTo(970, 270);
      ctx.stroke();
      ctx.setLineDash([]); // Reset line dash

      // Draw Route Lines if Enabled
      if (showTrails) {
        slide.players.forEach(p => {
          // Pre-Snap Motion Path (Dashed)
          if (p.isMotion && p.motionPath) {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 2.5;
            ctx.setLineDash([6, 5]);
            drawPathLine(p.motionPath);
            ctx.setLineDash([]);
          }

          // Main Route Path
          if (p.path && p.path.length > 1) {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 3.5;
            drawPathLine(p.path, true); // draw arrow head at end
          }
        });
      }

      // Draw Animated/Positioned Players
      slide.players.forEach(p => {
        let currentPos = getInterpolatedPos(p, animProgress);
        
        ctx.fillStyle = p.color;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;

        if (p.shape === "square") {
          ctx.beginPath();
          ctx.roundRect(currentPos.x - 14, currentPos.y - 14, 28, 28, 4);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(currentPos.x, currentPos.y, 14, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        // Draw Player Initial
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px Montserrat, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(p.role[0], currentPos.x, currentPos.y);
      });
    }

    function drawPathLine(pathPoints, drawArrow = false) {
      if (!pathPoints || pathPoints.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(pathPoints[0][0], pathPoints[0][1]);
      for (let i = 1; i < pathPoints.length; i++) {
        ctx.lineTo(pathPoints[i][0], pathPoints[i][1]);
      }
      ctx.stroke();

      if (drawArrow) {
        const last = pathPoints[pathPoints.length - 1];
        const prev = pathPoints[pathPoints.length - 2];
        const angle = Math.atan2(last[1] - prev[1], last[0] - prev[0]);
        
        ctx.save();
        ctx.fillStyle = ctx.strokeStyle;
        ctx.translate(last[0], last[1]);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-10, -6);
        ctx.lineTo(-10, 6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    // Calculates player position along multi-segment path based on progress (0.0 -> 1.0)
    function getInterpolatedPos(player, progress) {
      // Handle Jet Motion Phase first (0.0 to 0.25 progress)
      if (player.isMotion && player.motionPath) {
        if (progress < 0.25) {
          const mProg = progress / 0.25;
          return getPointAlongPath(player.motionPath, mProg);
        } else {
          const rProg = (progress - 0.25) / 0.75;
          return getPointAlongPath(player.path, rProg);
        }
      }

      // Standard route (starts moving after snap at 0.25)
      const rProg = Math.max(0, (progress - 0.25) / 0.75);
      return getPointAlongPath(player.path, rProg);
    }

    function getPointAlongPath(path, factor) {
      if (!path || path.length === 0) return { x: 0, y: 0 };
      if (path.length === 1 || factor <= 0) return { x: path[0][0], y: path[0][1] };
      if (factor >= 1) return { x: path[path.length - 1][0], y: path[path.length - 1][1] };

      // Calculate total path distance
      let totalLen = 0;
      let lengths = [];
      for (let i = 0; i < path.length - 1; i++) {
        let dx = path[i+1][0] - path[i][0];
        let dy = path[i+1][1] - path[i][1];
        let len = Math.sqrt(dx * dx + dy * dy);
        lengths.push(len);
        totalLen += len;
      }

      let targetDist = factor * totalLen;
      let accumulated = 0;

      for (let i = 0; i < lengths.length; i++) {
        if (accumulated + lengths[i] >= targetDist) {
          let segmentFactor = (targetDist - accumulated) / lengths[i];
          let x = path[i][0] + segmentFactor * (path[i+1][0] - path[i][0]);
          let y = path[i][1] + segmentFactor * (path[i+1][1] - path[i][1]);
          return { x, y };
        }
        accumulated += lengths[i];
      }

      return { x: path[path.length - 1][0], y: path[path.length - 1][1] };
    }

    /* ==========================================================================
       5. ANIMATION LOOP CONTROLS
       ========================================================================== */
    function startAnimation() {
      if (isPlaying) return;
      isPlaying = true;
      if (animProgress >= 1.0) animProgress = 0;
      lastTime = performance.now();
      playAnimBtn.classList.add('bg-sky-600');
      animFrameId = requestAnimationFrame(animLoop);
    }

    function pauseAnimation() {
      isPlaying = false;
      playAnimBtn.classList.remove('bg-sky-600');
      if (animFrameId) cancelAnimationFrame(animFrameId);
    }

    function resetAnimation() {
      pauseAnimation();
      animProgress = 0;
      drawPlayboard();
    }

    function animLoop(timestamp) {
      if (!isPlaying) return;

      const dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      // Complete full play loop in 4.0 seconds base speed
      animProgress += (dt / 4.0) * animSpeed;

      if (animProgress >= 1.0) {
        animProgress = 1.0;
        drawPlayboard();
        pauseAnimation();
        return;
      }

      drawPlayboard();
      animFrameId = requestAnimationFrame(animLoop);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // Initialize application on window load
    window.onload = function() {
      initApp();
    };
  </script>
